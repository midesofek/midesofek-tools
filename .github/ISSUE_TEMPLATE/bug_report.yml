name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: input
    id: tool
    attributes:
      label: Which tool
      placeholder: "QR Code Generator"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. What did you do, what did you expect, what actually happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /qr-code-generator
        2. Select WiFi tab
        3. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & device
      placeholder: "Chrome on macOS / Safari on iPhone 15"
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or recording
      description: Drag and drop, paste, or attach.
